version: 2

project_name: cachepin

before:
  hooks:
    - go mod tidy

builds:
  - id: cachepin
    main: ./cmd/cachepin
    binary: cachepin
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      # The version is embedded from the VERSION file at the repo root (package
      # version, //go:embed VERSION) — the single source of truth the lockstep
      # test asserts. The release checkout's VERSION file equals the tag, so no
      # link-time -X injection is needed (v0.10.0, fix-cli-missing-version-surface:
      # the previous -X main.version set a symbol that did not exist, a silent
      # no-op).
      - -s -w

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

release:
  github:
    owner: SuperMarioYL
    name: cachepin
  draft: false

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
